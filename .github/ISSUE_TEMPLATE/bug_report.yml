name: Bug report
description: Report incorrect, unclear, or broken skill guidance
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Pixasso. For security issues, use [private vulnerability reporting](https://github.com/Erebuzzz/pixasso/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: What is wrong?
      description: Describe the bug or incorrect guidance.
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Where?
      description: File paths or sections involved (for example skills/pixasso/SKILL.md).
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
