name: Publish to GitHub Packages

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - 'mcp-server/**'
      - '.github/workflows/publish-github-packages.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@erebuzzz'

      - name: Install dependencies and compile TypeScript
        run: |
          cd mcp-server
          npm ci --legacy-peer-deps
          npm run build

      - name: Prepare scoped package manifest for GitHub Packages
        run: |
          cd mcp-server
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@erebuzzz/pixasso-mcp';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Configured package for GitHub Packages:', pkg.name, pkg.version);
          "

      - name: Publish to GitHub Packages registry
        run: |
          cd mcp-server
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Target package: ${PKG_NAME}@${PKG_VERSION}"

          ALREADY_PUBLISHED=$(npm view "${PKG_NAME}@${PKG_VERSION}" version --registry=https://npm.pkg.github.com 2>/dev/null || true)

          if [ "$ALREADY_PUBLISHED" = "$PKG_VERSION" ]; then
            echo "Version ${PKG_VERSION} of ${PKG_NAME} is already published on GitHub Packages. Skipping publication."
          else
            echo "Publishing ${PKG_NAME}@${PKG_VERSION} to GitHub Packages registry..."
            OUTPUT=$(npm publish 2>&1) && echo "$OUTPUT" || {
              STATUS=$?
              echo "$OUTPUT"
              if echo "$OUTPUT" | grep -iq "409 Conflict"; then
                echo "Package version ${PKG_VERSION} is already published (HTTP 409). Skipping without error."
              else
                exit $STATUS
              fi
            }
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

