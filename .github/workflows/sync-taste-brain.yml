name: Sync Taste Brain & Swarm Memory

on:
  schedule:
    # Run daily at 00:00 UTC to sync memory snapshot
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-brain:
    name: Sync Live Memory to README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Memory Sync
        run: node scripts/sync-readme-brain.js

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: sync live taste brain and memory [skip ci]"

            # Attempt direct push to main first
            if git push origin main; then
              echo "Successfully pushed memory sync to main."
            else
              echo "Direct push to main was blocked by branch protection. Creating automated pull request..."
              BRANCH="sync/taste-brain"
              git checkout -B "$BRANCH"
              git push -u origin "$BRANCH" --force
              gh pr create \
                --title "chore: sync live taste brain and memory" \
                --body "Daily automated synchronization of the living taste brain and memory snapshot in README.md." \
                --base main \
                --head "$BRANCH" || echo "Pull request updated or already open."
            fi
          else
            echo "README.md is already up to date with living memory."
          fi
