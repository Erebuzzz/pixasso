name: Sync Taste Brain & Swarm Memory

on:
  schedule:
    # Run daily at 00:00 UTC to sync memory snapshot
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-brain:
    name: Sync Live Memory to README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Memory Sync
        run: node scripts/sync-readme-brain.js

      - name: Commit and Push Changes
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: sync live taste brain and memory [skip ci]"
            git push
          else
            echo "README.md is already up to date with living memory."
          fi
