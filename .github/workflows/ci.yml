name: CI & Skill Synchronization Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Verify Zero Skill Drift
        run: node scripts/sync-skill.js --check

      - name: Install MCP Server Dependencies
        run: npm ci --prefix mcp-server --legacy-peer-deps

      - name: Build MCP Server
        run: npm run build --prefix mcp-server

      - name: Run MCP Protocol Tests
        run: npm run test:mcp
